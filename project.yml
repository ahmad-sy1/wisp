name: wisp
options:
  bundleIdPrefix: com.ahmadalasmi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
targets:
  wisp:
    type: application
    platform: macOS
    sources:
      - path: Wisp
    info:
      path: Wisp/Resources/Info.plist
      properties:
        CFBundleDisplayName: wisp
        CFBundleName: wisp
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Ahmad Alasmi. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadalasmi.wisp
        PRODUCT_NAME: wisp
        GENERATE_INFOPLIST_FILE: NO
