name: wisp
options:
  bundleIdPrefix: com.ahmadalasmi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    # The one place the version lives; scripts/release.sh tags from it.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  wisp:
    type: application
    platform: macOS
    sources:
      - path: Wisp
      - path: Shared
    dependencies:
      # Claude Code runs this helper for each hook event (see WispHook/main.swift).
      - target: wisp-hook
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Wisp/Resources/Info.plist
      properties:
        CFBundleDisplayName: wisp
        CFBundleName: wisp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Ahmad Alasmi. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadalasmi.wisp
        PRODUCT_NAME: wisp
        GENERATE_INFOPLIST_FILE: NO
  wisp-hook:
    type: tool
    platform: macOS
    sources:
      - path: WispHook
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: wisp-hook
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadalasmi.wisp.hook
        SKIP_INSTALL: YES
