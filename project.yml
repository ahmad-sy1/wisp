name: wisp
options:
  bundleIdPrefix: com.ahmadalasmi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  # English is the source language; Dutch comes from the String Catalogs (Wisp/Resources).
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Developer ID for every local build: a stable signature, so macOS remembers the
    # Keychain and other permissions across updates. CI builds without signing.
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: VYYW6326D6
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    # The one place the version lives; scripts/release.sh tags from it.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Collect every LocalizedStringKey / String(localized:) for the String Catalogs.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  wisp:
    type: application
    platform: macOS
    sources:
      - path: Wisp
      - path: Shared
    dependencies:
      # Claude Code runs this helper for each hook event (see WispHook/main.swift).
      - target: wisp-hook
        embed: true
        codeSign: true
        copy:
          destination: executables
    postCompileScripts:
      - name: Build NowPlayingBridge
        # Loaded by /usr/bin/perl at runtime (see Wisp/Music/NowPlaying.swift):
        # MediaRemote only answers Apple-signed processes since macOS 15.4.
        script: |
          set -e
          OUT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/libNowPlayingBridge.dylib"
          mkdir -p "$(dirname "$OUT")"
          xcrun clang -dynamiclib -fobjc-arc -O2 -arch arm64 -arch x86_64 \
            -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -framework Foundation \
            "${SRCROOT}/Helpers/NowPlayingBridge.m" -o "$OUT"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ "$IDENTITY" = "-" ] || [ "$CODE_SIGNING_ALLOWED" = "NO" ]; then
            codesign --force --sign - "$OUT"
          elif [ "$CONFIGURATION" = "Release" ]; then
            # Notarization needs a secure timestamp and the hardened runtime.
            codesign --force --timestamp --options runtime --sign "$IDENTITY" "$OUT"
          else
            codesign --force --options runtime --sign "$IDENTITY" "$OUT"
          fi
        inputFiles:
          - $(SRCROOT)/Helpers/NowPlayingBridge.m
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/libNowPlayingBridge.dylib
    info:
      path: Wisp/Resources/Info.plist
      properties:
        CFBundleDisplayName: wisp
        CFBundleName: wisp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        # English here; translations in Wisp/Resources/InfoPlist.xcstrings.
        NSAudioCaptureUsageDescription: "wisp analyses the sound of what plays, live, for the spectrum in the Music tab. Nothing is recorded, stored or sent."
        NSCalendarsFullAccessUsageDescription: "wisp shows what's on your calendar today in the Calendar tab. Your calendar is only read and stays on your Mac."
        NSCalendarsUsageDescription: "wisp shows what's on your calendar today in the Calendar tab. Your calendar is only read and stays on your Mac."
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Ahmad Alasmi. All rights reserved."
    entitlements:
      # The hardened runtime blocks Calendar access without this (Agenda tab).
      path: Wisp/Resources/wisp.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadalasmi.wisp
        PRODUCT_NAME: wisp
        GENERATE_INFOPLIST_FILE: NO
  wisp-hook:
    type: tool
    platform: macOS
    sources:
      - path: WispHook
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: wisp-hook
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadalasmi.wisp.hook
        SKIP_INSTALL: YES
